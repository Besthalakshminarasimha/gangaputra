name: Dependency Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "package-lock.json"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit (fail on high/critical)
        id: audit
        run: npm audit --audit-level=high

      - name: Open alert issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Security alert: high/critical dependency vulnerability detected';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dependencies'
            });
            if (!issues.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                labels: ['dependencies', 'security'],
                body: `\`npm audit\` reported a high or critical vulnerability.\n\nRun \`npm audit\` locally and upgrade the affected packages.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
